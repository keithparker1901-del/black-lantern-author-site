<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author Browser Controls | R. Keith Parker</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="/styles.css"><script defer src="/script.js"></script><script defer src="/analytics.js"></script></head><body><main class="page-hero compact"><div><p class="eyebrow">Private author control</p><h1>Exclude this browser from visitor reporting.</h1><p class="lede">Use this page on the computer and browser you normally use to review the website. The setting stays only in this browser.</p><div class="actions"><button class="button" id="exclude" type="button">Exclude this browser</button><button class="button secondary" id="include" type="button">Count this browser again</button><a class="button ghost" href="/">Return home</a></div><p class="notice" id="status" aria-live="polite">Checking this browser…</p></div></main><script>window.addEventListener('load',()=>{const status=document.querySelector('#status');const refresh=()=>{const excluded=window.BlackLanternAnalytics?.isExcluded?.();status.textContent=excluded?'This browser is excluded from private visitor reporting.':'This browser is currently included in private visitor reporting.'};document.querySelector('#exclude').addEventListener('click',()=>{window.BlackLanternAnalytics?.excludeThisBrowser?.();refresh();});document.querySelector('#include').addEventListener('click',()=>{window.BlackLanternAnalytics?.includeThisBrowser?.();refresh();});refresh();});</script></body></html>
