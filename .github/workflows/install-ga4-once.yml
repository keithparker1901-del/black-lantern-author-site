name: Install GA4 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-ga4:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Google tag on every public HTML page
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          measurement_id = "G-25XXTG119S"
          src_marker = "https://www.googletagmanager.com/gtag/js?id=G-25XXTG119S"
          config_marker = "gtag('config', 'G-25XXTG119S');"
          inline_hash = "'sha256-KunRPIGU9vQekcGPNwuyCMs/8+j+KpssUVXfKhE0Wrg='"
          tag = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-25XXTG119S"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());

            gtag('config', 'G-25XXTG119S');
          </script>'''

          excluded_roots = {"owner", "author-tools"}
          public_pages = []

          for path in sorted(Path('.').rglob('*.html')):
              if any(part in excluded_roots for part in path.parts):
                  continue
              public_pages.append(path)
              text = path.read_text(encoding='utf-8')
              src_count = text.count(src_marker)
              config_count = text.count(config_marker)
              if src_count == 0 and config_count == 0:
                  updated, n = re.subn(r'(<head(?:\s[^>]*)?>)', r'\1\n' + tag + '\n', text, count=1, flags=re.I)
                  if n != 1:
                      raise RuntimeError(f"Could not find <head> in {path}")
                  path.write_text(updated, encoding='utf-8')
              elif src_count == 1 and config_count == 1:
                  pass
              else:
                  raise RuntimeError(f"Unexpected or duplicate Google tag markup in {path}")

          # Keep the existing CSP strict while permitting only the Google Analytics endpoints we need.
          vpath = Path('vercel.json')
          cfg = json.loads(vpath.read_text(encoding='utf-8'))
          for block in cfg.get('headers', []):
              if block.get('source') != '/(.*)':
                  continue
              for header in block.get('headers', []):
                  if header.get('key') != 'Content-Security-Policy':
                      continue
                  csp = header.get('value', '')
                  if 'https://www.googletagmanager.com' not in csp:
                      csp = csp.replace(
                          "script-src 'self';",
                          f"script-src 'self' https://www.googletagmanager.com {inline_hash};"
                      )
                  if "img-src 'self' data: https://www.google-analytics.com;" not in csp:
                      csp = csp.replace(
                          "img-src 'self' data:;",
                          "img-src 'self' data: https://www.google-analytics.com;"
                      )
                  if 'https://analytics.google.com' not in csp:
                      csp = csp.replace(
                          "connect-src 'self';",
                          "connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com;"
                      )
                  header['value'] = csp
          vpath.write_text(json.dumps(cfg, indent=2) + '\n', encoding='utf-8')

          # Validate exactly one Google tag per public page and its required placement.
          for path in public_pages:
              text = path.read_text(encoding='utf-8')
              if text.count(src_marker) != 1 or text.count(config_marker) != 1:
                  raise RuntimeError(f"GA4 validation failed for {path}")
              head_match = re.search(r'<head(?:\s[^>]*)?>', text, flags=re.I)
              if not head_match:
                  raise RuntimeError(f"Missing <head> in {path}")
              after_head = text[head_match.end():]
              if not after_head.lstrip().startswith('<!-- Google tag (gtag.js) -->'):
                  raise RuntimeError(f"Google tag is not immediately after <head> in {path}")

          print(f"Validated GA4 on {len(public_pages)} public HTML pages.")

      - name: Remove one-time installer and publish
        run: |
          rm -f .github/workflows/install-ga4-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Install GA4 across public pages"
          git push origin HEAD:main
