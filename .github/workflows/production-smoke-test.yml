name: Production site smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/production-smoke-test.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for current Vercel alias
        shell: bash
        run: |
          set -euo pipefail
          base="https://black-lantern-author-site.vercel.app"
          for attempt in $(seq 1 30); do
            curl --fail --location --silent --show-error "$base/analytics.js" -o /tmp/analytics.js || true
            if grep -q '/api/visit/' /tmp/analytics.js 2>/dev/null; then
              echo "Canonical API-route deployment is available on attempt $attempt."
              exit 0
            fi
            sleep 5
          done
          echo "Vercel alias did not switch to the expected deployment in time."
          exit 1

      - name: Verify public assets and endpoints
        shell: bash
        run: |
          set -euo pipefail
          base="https://black-lantern-author-site.vercel.app"

          curl --fail --location --silent --show-error "$base/" -o /tmp/home.html
          grep -q '/analytics.js' /tmp/home.html
          ! grep -q '/_vercel/insights/script.js' /tmp/home.html
          grep -q '/api/visit/' /tmp/analytics.js
          echo "Analytics JavaScript: OK"

          content_type="$(curl --fail --location --silent --show-error -o /tmp/guide.pdf -w '%{content_type}' "$base/downloads/valegast-manor-reader-guide.pdf")"
          echo "PDF content type: $content_type"
          [[ "$content_type" == application/pdf* ]]
          size="$(stat -c %s /tmp/guide.pdf)"
          echo "PDF size: $size bytes"
          test "$size" -gt 1000000
          test "$(head -c 5 /tmp/guide.pdf)" = '%PDF-'
          echo "Reader-guide PDF: OK"

          code="$(curl --silent --show-error -o /tmp/visit-response -w '%{http_code}' \
            -X POST "$base/api/visit/" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: Mozilla/5.0 BlackLanternQA/1.0' \
            --data '{"event":"pageview","visitorId":"production-smoke-test","path":"/__smoke_test__","title":"Production smoke test","referrer":""}')"
          echo "Page-view logger status: $code"
          test "$code" = '204'

          code="$(curl --silent --show-error -o /tmp/action-response -w '%{http_code}' \
            -X POST "$base/api/visit/" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: Mozilla/5.0 BlackLanternQA/1.0' \
            --data '{"event":"reader_action","visitorId":"production-smoke-test","path":"/__smoke_test__","title":"Production smoke test","kind":"amazon","target":"https://www.amazon.com/dp/B0H1JJJ8QV"}')"
          echo "Reader-action logger status: $code"
          test "$code" = '204'

          code="$(curl --silent --show-error -o /tmp/get-response -w '%{http_code}' "$base/api/visit/")"
          echo "Visit GET rejection status: $code"
          test "$code" = '405'

          code="$(curl --silent --show-error -o /tmp/signup-response -w '%{http_code}' \
            -X POST "$base/api/subscribe/" \
            -H 'Content-Type: application/json' \
            --data '{"email":"not-an-email","consent":false}')"
          echo "Signup validation status: $code"
          test "$code" = '400'

          curl --fail --location --silent --show-error "$base/author-tools/" -o /tmp/author-tools.html
          grep -q 'Exclude this browser' /tmp/author-tools.html
          echo "Author browser controls: OK"
          echo "Production smoke tests passed."

      - name: Remove temporary diagnostics and commit verification record
        run: |
          rm -f .github/workflows/production-smoke-test.yml
          rm -f api/github-actions-probe.js
          mkdir -p build
          printf '%s\n' "${{ github.run_id }}" > build/production-smoke-test-run-id.txt
          git config user.name "Black Lantern Production Test"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record successful production smoke test"
          git push origin HEAD:main
