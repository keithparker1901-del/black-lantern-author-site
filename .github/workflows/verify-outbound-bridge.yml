name: Verify durable outbound bridge

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-outbound-bridge.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for current Vercel alias
        run: |
          set -euo pipefail
          base="https://black-lantern-author-site.vercel.app"
          for attempt in $(seq 1 30); do
            curl --fail --silent --show-error "$base/analytics.js" -o /tmp/analytics.js || true
            if grep -q '/api/outbound-click/' /tmp/analytics.js; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Verify bridge validation without creating a click
        run: |
          set -euo pipefail
          base="https://black-lantern-author-site.vercel.app"
          code="$(curl --silent --show-error -o /tmp/invalid-response -w '%{http_code}' \
            -X POST "$base/api/outbound-click/" \
            -H 'Content-Type: application/json' \
            --data '{"url":"javascript:void(0)","label":"Validation only","pagePath":"/__verification__"}')"
          test "$code" = '400'
          code="$(curl --silent --show-error -o /tmp/get-response -w '%{http_code}' "$base/api/outbound-click/")"
          test "$code" = '405'
          grep -q '/api/outbound-click/' /tmp/analytics.js
          echo "Outbound bridge validation passed without recording a click."

      - name: Remove workflow and record verification
        run: |
          rm -f .github/workflows/verify-outbound-bridge.yml
          mkdir -p build
          printf '%s\n' "${{ github.run_id }}" > build/outbound-bridge-verification-run-id.txt
          git config user.name "Black Lantern Analytics Test"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record successful outbound bridge verification"
          git push origin HEAD:main
