name: Install homepage hero

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/install-homepage-hero.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image verifier
        run: python -m pip install pillow

      - name: Assemble and verify hero image
        run: |
          set -euo pipefail
          mkdir -p images/hero
          cat \
            .hero-image-parts/part01.b64 \
            .hero-image-parts/part02a.b64 \
            .hero-image-parts/part02b.b64 \
            .hero-image-parts/part03a.b64 \
            .hero-image-parts/part03b.b64 \
            .hero-image-parts/part04a.b64 \
            .hero-image-parts/part04b.b64 \
            .hero-image-parts/part05a.b64 \
            .hero-image-parts/part05b.b64 \
            > /tmp/lantern-road-hero.b64
          base64 --decode /tmp/lantern-road-hero.b64 > images/hero/lantern-road-hero.webp
          echo "702ce442d34f6aa0210dc7fb33707a63a6d38eb3b78e3eb66be420b955e36dfd  images/hero/lantern-road-hero.webp" | sha256sum --check
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('images/hero/lantern-road-hero.webp')
          with Image.open(path) as image:
              image.load()
              assert image.size == (1200, 675), image.size
              assert image.format == 'WEBP', image.format
          assert path.stat().st_size == 42436, path.stat().st_size
          print(f'Verified {path}: 1200x675, {path.stat().st_size:,} bytes')
          PY

      - name: Add cinematic hero styling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* BLACK LANTERN HOMEPAGE HERO */'
          css = r'''
          /* BLACK LANTERN HOMEPAGE HERO */
          .hero{
            position:relative;
            isolation:isolate;
            overflow:hidden;
            max-width:none;
            min-height:78vh;
            margin:0;
            padding:clamp(4.75rem,8vw,7.5rem) max(1.25rem,calc((100vw - var(--max))/2 + 1.25rem));
            border-bottom:1px solid var(--line);
            grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);
          }
          .hero::before{
            content:"";
            position:absolute;
            inset:-1.5%;
            z-index:-2;
            background:url('/images/hero/lantern-road-hero.webp') 62% center/cover no-repeat;
          }
          .hero::after{
            content:"";
            position:absolute;
            inset:0;
            z-index:-1;
            background:
              linear-gradient(90deg,rgba(3,5,6,.90) 0%,rgba(5,6,7,.76) 34%,rgba(6,7,8,.34) 62%,rgba(3,4,5,.50) 100%),
              linear-gradient(180deg,rgba(0,0,0,.20),rgba(0,0,0,.52));
          }
          .hero>*{position:relative;z-index:1}
          .hero .hero-copy{max-width:46rem}
          .hero h1{text-shadow:0 3px 24px rgba(0,0,0,.78)}
          .hero .lede{text-shadow:0 2px 14px rgba(0,0,0,.8)}
          .hero .hero-seal{
            background:linear-gradient(135deg,rgba(28,27,22,.72),rgba(14,14,12,.88));
            backdrop-filter:blur(5px);
            box-shadow:0 22px 60px rgba(0,0,0,.38);
          }
          .hero .button.secondary{background:rgba(0,0,0,.30)}
          .hero .tag-row span{background:rgba(0,0,0,.28)}
          @media(max-width:850px){
            .hero{
              min-height:auto;
              padding:4rem 1.25rem;
              grid-template-columns:1fr;
            }
            .hero::before{background-position:70% center}
            .hero .hero-seal{max-width:420px;width:100%;margin:0 auto}
          }
          @media(prefers-reduced-motion:no-preference){
            .hero::before{transform:scale(1.015)}
          }
          '''
          if marker not in text:
              path.write_text(text.rstrip() + '\n\n' + css.strip() + '\n', encoding='utf-8')
          else:
              raise SystemExit('Homepage hero marker already exists; refusing duplicate installation')
          PY

      - name: Verify website references
        run: |
          set -euo pipefail
          grep -q "BLACK LANTERN HOMEPAGE HERO" styles.css
          grep -q "/images/hero/lantern-road-hero.webp" styles.css
          grep -q '<section class="hero">' index.html
          test -s images/hero/lantern-road-hero.webp

      - name: Commit installation and remove temporary files
        run: |
          set -euo pipefail
          rm -rf .hero-image-parts
          rm -f .github/workflows/install-homepage-hero.yml
          rm -f api/hero-workflow-status.js api/hero-chunk-diagnostics.js
          mkdir -p build
          printf '%s\n' "${{ github.run_id }}" > build/homepage-hero-install-run-id.txt
          git config user.name "Black Lantern Site Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add cinematic homepage hero background"
          git push origin HEAD:main
