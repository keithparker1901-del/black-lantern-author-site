<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Lantern Road Visitor Clicker</title><style>body{font-family:Georgia,serif;max-width:1000px;margin:40px auto;padding:0 20px;background:#0b0c0a;color:#eee7d8}a{color:#f0d18b}.muted{color:#bdb3a1}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border:1px solid #665638;padding:18px;background:#11120f}.num{font:700 2rem Arial,sans-serif}.row{border-top:1px solid #332d22;padding:12px 0}.tag{display:inline-block;border:1px solid #665638;padding:3px 7px;margin-left:6px;font:12px Arial,sans-serif}button{padding:10px 14px;background:#d7ad60;border:0;font-weight:700}code{overflow-wrap:anywhere;color:#bdb3a1}</style></head><body><p class="muted"><strong>Private owner view</strong></p><h1>Lantern Road Visitor Clicker</h1><p>A private count of human visits and outbound reader actions on R. Keith Parker's website.</p><div id="status">Loading…</div><main id="app"></main><p><button onclick="load()">Refresh count</button> &nbsp; <a href="/">Return to the public site</a></p><script>const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));async function load(){const status=document.getElementById('status'),app=document.getElementById('app');status.textContent='Loading…';try{const r=await fetch('/api/private-analytics',{cache:'no-store'}),d=await r.json();if(!r.ok)throw new Error(d.message||'Could not load analytics');status.textContent='';const days=Object.entries(d.days||{}).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,7);const dest=Object.entries(d.byDestination||{}).sort((a,b)=>b[1]-a[1]);app.innerHTML=`<div class="cards"><div class="card">Total visits<div class="num">${d.totalVisits}</div></div><div class="card">Unique visitors<div class="num">${d.uniqueVisitors}</div></div><div class="card">Outbound clicks<div class="num">${d.totalOutboundClicks}</div></div><div class="card">Unique clickers<div class="num">${d.uniqueClickers}</div></div></div><h2>Last seven recorded days</h2>${days.map(x=>`<div class="row">${esc(x[0])} <strong>${x[1]}</strong></div>`).join('')||'<p class="muted">No stored visits yet.</p>'}<h2>Clicks by destination</h2>${dest.map(x=>`<div class="row">${esc(x[0])} <strong>${x[1]}</strong></div>`).join('')||'<p class="muted">No stored clicks yet.</p>'}<h2>Most recent clicks</h2>${(d.recent||[]).map(x=>`<div class="row"><strong>${esc(x.destination)}</strong> ${esc(x.label)} <span class="tag">${esc(x.attribution)}</span><br><span class="muted">From ${esc(x.pagePath)} · ${esc(x.at)}</span>${x.campaign?`<br><span class="muted">Campaign: ${esc(x.campaign)}</span>`:''}${x.rawPagePath!==x.pagePath?`<details><summary>Raw attribution URL</summary><code>${esc(x.rawPagePath)}</code></details>`:''}</div>`).join('')||'<p class="muted">No stored clicks yet.</p>'}`;}catch(e){status.textContent=e.message;app.innerHTML='';}}load();</script></body></html>
